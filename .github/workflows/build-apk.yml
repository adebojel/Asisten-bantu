name: Build Kobra OS APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Uji logika murni (OfflineBrain, AppMatcher, PhoneFormat)
        run: |
          mkdir -p /tmp/ob
          J=app/src/main/java/com/asisten/bantu
          javac -encoding UTF-8 -d /tmp/ob $J/OfflineBrain.java $J/AppMatcher.java $J/PhoneFormat.java tools/OfflineBrainCheck.java tools/AppMatcherCheck.java
          java -cp /tmp/ob com.asisten.bantu.OfflineBrainCheck
          java -cp /tmp/ob com.asisten.bantu.AppMatcherCheck
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kobra-OS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
