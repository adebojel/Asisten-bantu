name: Auto Build and Release
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

# Avoid concurrent main pushes racing to publish an older commit as Latest.
concurrency:
  group: kobra-os-main-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Stage 5 privacy and offline-AI regression guard
        run: node tools/Stage5SecurityCheck.mjs
      - name: Validate web navigation safety and frontend
        run: |
          node tools/NavigationSafetyCheck.mjs
          npm run lint
          npm run build
      - name: Build and run Android unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare APK and checksum
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Kobra-OS-main.apk
          cd release
          sha256sum Kobra-OS-main.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kobra-OS-APK
          path: release/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kobra-os-build-${{ github.run_number }}
          name: Kobra OS — Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            APK KOBRA OS dari branch main.

            Commit sumber: ${{ github.sha }}
            Branch: main

            AI percakapan dan analisis visual berjalan melalui jalur lokal yang tersedia; tidak ada fallback AI cloud. Internet tetap dapat dipakai untuk unduhan model/peta atau fungsi non-AI yang dijelaskan aplikasi.

            **Jenis paket:** debug APK, bukan sertifikasi produksi.
            **Verifikasi:** cocokkan SHA-256SUMS.txt sebelum instalasi.
            **Uji perangkat:** CI bukan pengganti pengujian mikrofon, kamera, GPS, TalkBack, SIM/operator, dan layanan latar belakang pada HP nyata.
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
