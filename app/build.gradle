plugins { 
    id 'com.android.application' 
}

android {
    namespace 'com.asisten.bantu'
    compileSdk 36

    defaultConfig {
        applicationId "com.asisten.bantu"
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName "7.1-KOBRA"
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }

    androidResources {
        noCompress 'task', 'tflite', 'bin', 'lite'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX & Material Design
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'

    // CameraX 1.3.1
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // Google ML Kit (Offline Vision, Barcode, Translation & Text Recognition)
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:object-detection:16.0.0'
    implementation 'com.google.mlkit:face-detection:16.1.6'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:translate:17.0.3'

    // MediaPipe LLM Inference API (Pengolahan Bahasa Offline On-Device)
    implementation 'com.google.mediapipe:tasks-genai:0.10.14'

    // Pengujian
    testImplementation 'junit:junit:4.13.2'
}
