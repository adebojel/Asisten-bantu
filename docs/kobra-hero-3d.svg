<title id="title">Kobra OS — ilustrasi konsep antarmuka asisten AI</title>
<desc id="desc">Ilustrasi konseptual tiga dimensi sebuah ponsel dengan antarmuka asisten suara Kobra, gelombang suara, dan panel AI hybrid. Bukan tangkapan layar aplikasi.</desc>
